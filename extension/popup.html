<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keep → Claude</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 240px;
      padding: 16px;
      margin: 0;
      background: #fafafa;
      color: #202124;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
    }
    .dot.connected    { background: #34a853; }
    .dot.disconnected { background: #ea4335; }
    .status-text {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 14px;
    }
    .instructions {
      font-size: 12px;
      color: #80868b;
      line-height: 1.5;
      border-top: 1px solid #e0e0e0;
      padding-top: 12px;
    }
    code {
      background: #f1f3f4;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Keep → Claude Bridge</h1>
  <p class="status-text" id="status">Checking connection…</p>
  <div class="instructions">
    <strong>Setup:</strong><br>
    1. Run <code>node server.js</code> in the <code>mcp-server/</code> folder.<br>
    2. Open <a href="https://keep.google.com" target="_blank">keep.google.com</a>.<br>
    3. Ask Claude: <em>"What notes do I have?"</em>
  </div>

  <script src="popup.js"></script>
</body>
</html>
