<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keep → Claude</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 260px;
      padding: 16px;
      margin: 0;
      background: #fafafa;
      color: #202124;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    .dot.connected    { background: #34a853; }
    .dot.disconnected { background: #ea4335; }
    .status-text {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 12px;
    }

    .download-btn {
      display: none;
      width: 100%;
      padding: 10px 0;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .download-btn:hover { background: #1558b0; }

    .instructions {
      font-size: 12px;
      color: #80868b;
      line-height: 1.6;
      border-top: 1px solid #e0e0e0;
      padding-top: 10px;
    }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Keep → Claude Bridge</h1>
  <p class="status-text" id="status">Checking connection…</p>

  <a id="downloadBtn" class="download-btn"
     href="https://github.com/Bronzeace1/google-keep-claude-bridge/releases/latest/download/KeepClaudeInstaller.zip"
     target="_blank">
    Download &amp; Install Bridge
  </a>

  <div class="instructions" id="instructions"></div>

  <script src="popup.js"></script>
</body>
</html>
